<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Shield Agent</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #161b22;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            width: 400px;
        }

        h1 {
            margin-bottom: 20px;
            color: #58a6ff;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

            button:hover {
                background: #2ea043;
                transform: scale(1.05);
            }

        .status {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Atomic Shield Agent</h1>
        <p>Welcome to the new C# WebView2 UI</p>
        <button onclick="startAgent()">Start Agent</button>
        <button onclick="stopAgent()">Stop Agent</button>

        <div class="status" id="status">Status: Idle</div>
    </div>

    <script>
        // Send command to C# backend
        function startAgent() {
            if (window.chrome && chrome.webview) {
                chrome.webview.postMessage("start");
            } else {
                document.getElementById("status").textContent = "Status: chrome.webview not available";
            }
        }

        function stopAgent() {
            if (window.chrome && chrome.webview) {
                chrome.webview.postMessage("stop");
            } else {
                document.getElementById("status").textContent = "Status: chrome.webview not available";
            }
        }

        // Receive messages from C# via CoreWebView2.PostWebMessageAsString(...)
        if (window.chrome && chrome.webview) {
            chrome.webview.addEventListener('message', event => {
                document.getElementById("status").textContent = "Status: " + event.data;
            });
        }
    </script>

</body>
</html>
